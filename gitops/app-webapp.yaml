apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
  annotations:
    # images to track (aliases: backend, frontend)
    argocd-image-updater.argoproj.io/image-list: |
      backend=docker.io/volodymyrbjj/app-go,frontend=docker.io/volodymyrbjj/app-js

    # values that hold image name/tag for each alias
    argocd-image-updater.argoproj.io/backend.helm.image-name: backend.image.repository
    argocd-image-updater.argoproj.io/backend.helm.image-tag: backend.image.tag
    argocd-image-updater.argoproj.io/frontend.helm.image-name: frontend.image.repository
    argocd-image-updater.argoproj.io/frontend.helm.image-tag: frontend.image.tag

    # directly mutate the argocd application (no git commit needed)
    argocd-image-updater.argoproj.io/write-back-method: argocd

    # "digest" follows a mutable tag (e.g., 'latest') by pinning to the new image digest
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
    argocd-image-updater.argoproj.io/backend.pull-secret: pullsecret:argocd/dockerhub-creds
    argocd-image-updater.argoproj.io/frontend.pull-secret: pullsecret:argocd/dockerhub-creds
spec:
  project: default
  source:
    repoURL: https://github.com/voloshyn1992/it-works-on-my-machine.git
    targetRevision: main
    path: charts/webapp
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
