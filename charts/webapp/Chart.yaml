apiVersion: v2
name: webapp
description: A Helm chart for Kubernetes
type: application
version: 0.1.0
appVersion: "1.16.0"
dependencies:
  - name: redis
    version: 20.3.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: postgresql
    alias: postgres
    version: 15.2.9
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgres.enabled
