name: deploy-build-push-backend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default sha-<7>)"
        required: false
        default: ""

jobs:
  deploy-build-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: docker.io/volodymyrbjj/app-go

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        working-directory: backend
        run: go test -race -v ./...

      # Derive TAG: use input if provided, else sha-<7>
      - name: Compute TAG
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.TAG }}
            ${{ env.IMAGE }}:latest
          provenance: false
