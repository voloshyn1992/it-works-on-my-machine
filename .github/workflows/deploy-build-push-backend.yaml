name: deploy-build-push-backend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: ""
      paths-ignore:
        - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: docker.io/volodymyrbjj/app-go
      TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || format('sha-{0}', github.sha[0:7]) }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Test
        run: |
          cd backend
          go test ./...

      - name: Derive short SHA
        id: vars
        run: echo "SHA7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            docker.io/volodymyrbjj/app-go:sha-${{ steps.vars.outputs.SHA7 }}
            docker.io/volodymyrbjj/app-go:latest
          provenance: false

