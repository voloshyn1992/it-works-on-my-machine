name: deploy-build-push-frontend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default sha-<7>)"
        required: false
        default: ""

jobs:
  deploy-build-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: docker.io/volodymyrbjj/app-js

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test --if-present

      # Derive TAG: use input if provided, else sha-<7>
      - name: Compute TAG
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.TAG }}
            ${{ env.IMAGE }}:latest
          provenance: false
